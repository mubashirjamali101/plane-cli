name: Release

# Publishes the binaries that INSTALL.md and install.sh expect, from a version tag:
#   git tag v1.0.0 && git push origin v1.0.0
#
# The only external input is the tag name, and it is passed through `env:` rather than
# interpolated into a shell command. No issue or PR text reaches a `run:` step.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest # macOS can produce every artifact, including the universal .pkg/.dmg
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Verify before publishing
        run: bun run check

      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(bun --print 'require("./package.json").version')"
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match package.json version $version" >&2
            exit 1
          fi

      - name: Build binaries for every platform
        run: ./build.sh

      - name: Build native installers
        run: |
          brew install msitools squashfs
          ./package.sh

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
